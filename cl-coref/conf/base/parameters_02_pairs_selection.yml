# Parameters for Pipeline 02: Pairs Selection

# SBERT model for encoding sentences
sbert_model_name: "sentence-transformers/all-mpnet-base-v2"

# Batch size for similarity computation (prevents OOM on large topics)
# Processes this many sentences at a time when computing pairwise similarities
# Lower values use less memory but take longer; higher values are faster but need more memory
# Default: 1000 sentences per batch
similarity_batch_size: 1000

# Additional sampling configuration
# Set to false initially to see the full distribution of pairs by topic
additional_sampling: false
