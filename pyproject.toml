[tool.poetry]
name = "cdcr-lexical-diversity"
version = "0.1.0"
description = "dependencies for CDCR and paraphrase identification models"
authors = ["sago2693 <56797497+sago2693@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "cdcr_lexical_diversity"}]

[tool.poetry.dependencies]
python = "3.7.16"
transformers = "3.3.1"
pytorch-lightning = "0.9.0"
jupyter = "^1.0.0"
protobuf = "3.20.3"
spacy = "3.5.0"
pyhocon = "^0.3.60"
scikit-learn = "1.0.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
