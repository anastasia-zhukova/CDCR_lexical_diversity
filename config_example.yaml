# Example configuration file for topic filtering

# List of topics to filter (format: "DatasetName-TopicID")
# If empty list or null, all topics will be loaded
filtered_topics:
  - "ECBplus-1"
  - "ECBplus-2"
  - "ECBplus-5"
  # Add more topics as needed

# To load all topics, use either:
# filtered_topics: []
# or
# filtered_topics: null
