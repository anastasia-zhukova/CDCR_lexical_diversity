# Parameters for Pipeline 03: Training

# Training mode: "single", "all_but", or "all"
# - "single": Train on a single dataset specified by training_dataset
# - "all_but": Train on all datasets EXCEPT the one specified by training_dataset
# - "all": Train on ALL datasets (dataset_name parameter is ignored)
training_mode: "all"  # "single", "all_but", or "all"

# Dataset parameter (meaning depends on training_mode)
# - In "single" mode: the dataset to train on
# - In "all_but" mode: the dataset to EXCLUDE from training
# - In "all" mode: this parameter is IGNORED (can be set to any value)
training_dataset: "all"
#"ECBplus"
#"GVC"
#"HyperCoref"
#"WECEng"
#"NiDENT"
#"NP4E"
#"NewsWCL50"
#"ECBplusMETAm"
#"all"

# Datasets with train splits (for reference)
# ECBplus, GVC, HyperCoref, NiDENT, NP4E, WECEng (6 total)
# Datasets without train splits (never used in training): NewsWCL50, ECBplusMETAm
#
# How training modes work:
#
# 1. "single" mode:
#    - Training: Uses all 50,000 pairs from the specified dataset
#    - Validation: Uses validation mentions from the specified dataset only
#    - Checkpoints saved to: data/06_models/{dataset_name}/
#
# 2. "all_but" mode:
#    - Training: Samples 50,000 pairs total from all datasets with train splits EXCEPT the excluded one
#      - Pairs distributed equally across participating datasets (~10,000 per dataset if 5 participate)
#      - Maintains 1:10 positive:negative ratio per dataset
#    - Validation: Uses ALL validation mentions from all datasets EXCEPT the excluded one
#      - This includes NewsWCL50 and ECBplusMETAm (which have no train data but do have validation data)
#    - Checkpoints saved to: data/06_models/all-but-{excluded_dataset}/
#    - Special cases: all-but-NewsWCL50 and all-but-ECBplusMETAm have identical training data
#      (since these datasets don't have train splits), but different validation data
#
# 3. "all" mode:
#    - Training: Samples 50,000 pairs total from ALL datasets with train splits (all 6 datasets)
#      - Pairs distributed equally: ~8,333 per dataset
#      - Maintains 1:10 positive:negative ratio per dataset
#    - Validation: Uses ALL validation mentions from ALL datasets
#      - Includes all 6 training datasets + NewsWCL50 + ECBplusMETAm (8 datasets total)
#    - Checkpoints saved to: data/06_models/all/

# Training configuration
training_config:
  # Model settings
  language_model: "roberta-large"  # Only roberta-large is supported by the existing code
  sentence_transformer_model: "sentence-transformers/all-mpnet-base-v2"
  learning_rate: 2.0e-7  # Conservative LR matching original CL_COREF
  max_length: 128  # Total tokens for document_context + mention_context concatenation

  # Training settings
  num_epochs: 10
  train_batch_size: 32  # Increased due to shorter sequences (128 vs 512 tokens)
  val_batch_size: 128   # Increased for faster validation
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1  # No accumulation needed with batch_size=16

  # Hardware settings
  accelerator: "gpu"
  devices: 1
  precision: "16-mixed"

  # Checkpoint settings
  monitor_metric: "val_f1_conll"
  save_top_k: 1

  # Logging
  log_every_n_steps: 50

  # Data settings
  # Use 'sent' to get mention_context (which has [E] markers)
  # Use 'doc' to get document_context (which doesn't have [E] markers)
  context_method: "sent"  # MUST be 'sent' for siamese network with special tokens
  special_tokens: ["E"]

  # Validation clustering settings
  # Clustering threshold for hierarchical clustering (distance threshold)
  # Lower = more clusters, Higher = fewer clusters
  # 0.5 is standard for cosine distance (1 - cosine_similarity)
  similarity_threshold: 0.5
